[workspace]
resolver = "2"
members = ["crates/constellation-core", "crates/constellation-serve", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# duckdb-rs 1.10505 = DuckDB 1.5.5. Python duckdb 1.5.5와 같은 저장 형식.
# (2026-09-17 duckdb-rs README "Versioning" 절에서 확인)
duckdb = { version = "~1.10505", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"


# cargo 기본 release 프로필의 strip = "debuginfo"가 이 Mac(macOS 27, rustc 1.97)에서
# proc-macro dylib(ctor-proc-macro 0.0.7)의 rustc 메타데이터를 지워 `ctor`가
# E0463 "can't find crate"로 실패한다(2026-09-19 `tauri build`에서 확인). 릴리스 빌드는
# strip 없이 한다. 앱 크기는 53MB로 strip한 것과 1MB 차이다.
[profile.release]
strip = "none"
