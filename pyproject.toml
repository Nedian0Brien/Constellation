[project]
name = "constellation"
version = "0.1.0"
description = "논문 초록으로 연구 지형을 2D/3D 지도로 그린다"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "scikit-learn>=1.5",
]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
constellation = "constellation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
